<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenLayers · GeoLakeLayers live demo</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="vendor/ol.css">
  <link rel="stylesheet" href="style.css">
  <script src="vendor/ol.js"></script>
</head>
<body>
  <div id="map"></div>
  <div id="caption"></div>
  <div id="status">Loading…</div>
  <div id="ol-popup" hidden></div>
  <script type="module">
    // A day of vessel tracks in Puget Sound over satellite imagery, colored by vessel type
    import { checkService, items, caption, status, done, fail, nav, popupHtml, VESSEL_GROUPS, vesselGroup, splitJumps, basemap, basemapKey } from './common.js'
    nav()
    const BBOX = '-123.2,47.0,-122.2,48.4'
    const EMPTY = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'
    // a tile that is nearly all white, sampled at 8x8, is a no-coverage tile
    function dropBlankTiles (tile, src) {
      const img = tile.getImage()
      fetch(src).then(r => r.blob()).then(async blob => {
        const c = new OffscreenCanvas(8, 8).getContext('2d')
        c.drawImage(await createImageBitmap(blob, { resizeWidth: 8, resizeHeight: 8 }), 0, 0)
        const px = c.getImageData(0, 0, 8, 8).data
        let white = 0
        for (let i = 0; i < px.length; i += 4) if (px[i] > 240 && px[i + 1] > 240 && px[i + 2] > 240) white++
        if (white >= 60) { img.src = EMPTY; return }
        const url = URL.createObjectURL(blob)
        img.addEventListener('load', () => URL.revokeObjectURL(url), { once: true })
        img.src = url
      }).catch(() => { img.src = src })
    }
    const imagery = new ol.layer.Tile({
      source: new ol.source.XYZ({
        url: basemap.imagery.tiles, attributions: basemap.imagery.attribution, maxZoom: basemap.imagery.maxZoom, crossOrigin: 'anonymous',
        // USGS imagery covers the U.S. only; outside it (Vancouver Island is in view) the server answers with plain
        // white tiles. Drop those so the dark map background shows instead. Esri's World Imagery covers everywhere.
        ...(basemapKey === 'open' ? { tileLoadFunction: dropBlankTiles } : {})
      })
    })
    // Commercial traffic on top with a dark casing; pleasure craft faint underneath (they are most of the tracks)
    const LEISURE = 'Pleasure / sailing'
    const styles = Object.fromEntries(VESSEL_GROUPS.map(([name, color], i) => [name, name === LEISURE
      ? [new ol.style.Style({ stroke: new ol.style.Stroke({ color: 'rgba(255,158,199,0.35)', width: 0.8 }), zIndex: 0 })]
      : [new ol.style.Style({ stroke: new ol.style.Stroke({ color: 'rgba(0,0,0,0.5)', width: 3.4 }), zIndex: 10 - i }),
         new ol.style.Style({ stroke: new ol.style.Stroke({ color, width: 1.8 }), zIndex: 20 - i })]]))
    const source = new ol.source.Vector()
    const map = new ol.Map({
      target: 'map',
      layers: [imagery, new ol.layer.Vector({ source, renderOrder: null, style: f => styles[vesselGroup(f.get('vessel_type'))[0]] })],
      // opens a little south of the tracks' center on the open basemap, so the first view stays inside USGS coverage
      view: new ol.View({ center: ol.proj.fromLonLat(basemapKey === 'open' ? [-122.42, 47.54] : [-122.48, 47.72]), zoom: 9.6 })
    })
    // Identify: an overlay anchored where the track was clicked
    const popupEl = document.getElementById('ol-popup')
    const popup = new ol.Overlay({ element: popupEl, positioning: 'bottom-center', offset: [0, -10], autoPan: { animation: { duration: 200 } } })
    map.addOverlay(popup)
    const HIT = { hitTolerance: 6 }
    map.on('singleclick', e => {
      const f = map.forEachFeatureAtPixel(e.pixel, f => f, HIT)
      if (!f) { popupEl.hidden = true; popup.setPosition(undefined); return }
      popupEl.innerHTML = `<button class="close" type="button" aria-label="Close">×</button>` + popupHtml('tracks', f.getProperties())
      popupEl.querySelector('.close').onclick = () => { popupEl.hidden = true; popup.setPosition(undefined) }
      popupEl.hidden = false
      popup.setPosition(e.coordinate)
    })
    map.on('pointermove', e => { if (!e.dragging) map.getTargetElement().style.cursor = map.hasFeatureAtPixel(e.pixel, HIT) ? 'pointer' : '' })
    try {
      await checkService()
      const tracks = await items('tracks', `bbox=${BBOX}`, n => status(`Loading tracks… ${n.toLocaleString()}`))
      source.addFeatures(new ol.format.GeoJSON().readFeatures(splitJumps(tracks), { featureProjection: 'EPSG:3857' }))
      const counts = {}
      tracks.features.forEach(f => { const g = vesselGroup(f.properties.vessel_type)[0]; counts[g] = (counts[g] || 0) + 1 })
      caption({
        client: 'OpenLayers',
        title: 'Puget Sound vessel tracks, July 4 2024',
        sub: `${tracks.features.length.toLocaleString()} AIS tracks from Unity Catalog, styled by vessel type over satellite imagery.`,
        legend: VESSEL_GROUPS.filter(([name]) => counts[name]).map(([name, color]) => [color, `${name} (${counts[name]})`]),
        hint: 'Click a track for the vessel\u2019s attributes.'
      })
      map.once('rendercomplete', done)
      map.render()
    } catch (err) { fail(err) }
  </script>
</body>
</html>
