<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leaflet · GeoLakeLayers live demo</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="style.css">
  <script src="vendor/leaflet.js"></script>
  <link rel="stylesheet" href="vendor/maplibre-gl.css">
</head>
<body>
  <div id="map"></div>
  <div id="caption"></div>
  <div id="status">Loading…</div>
  <script type="module">
    // Ten minutes of AIS positions in the Houston Ship Channel and Galveston Bay, using the collection's
    // time field (OGC API – Features datetime=), colored by speed over ground
    import { checkService, items, caption, status, done, fail, nav, popupHtml, basemap } from './common.js'
    nav()
    const BBOX = '-95.3,29.0,-94.6,29.8'
    const WHEN = '2024-07-04T15:00:00Z/2024-07-04T15:10:00Z'
    const map = L.map('map', { zoomControl: false, preferCanvas: true }).setView([29.42, -94.95], 11)
    L.control.zoom({ position: 'bottomright' }).addTo(map)
    // The open basemap is vector tiles with a MapLibre style, drawn in Leaflet by maplibre-gl-leaflet; Esri's is raster
    const dark = basemap.dark
    if (dark.style) {
      // the plugin is a classic script that finds MapLibre and Leaflet as globals; MapLibre 6 is a module, so
      // expose it first, then load the plugin
      window.maplibregl = await import('./vendor/maplibre-gl.mjs')
      await new Promise((ok, bad) => { const s = document.createElement('script'); s.src = 'vendor/leaflet-maplibre-gl.js'; s.onload = ok; s.onerror = bad; document.head.appendChild(s) })
      L.maplibreGL({ style: dark.style, interactive: false }).addTo(map)
    }
    else L.tileLayer(dark.tiles, { attribution: dark.attribution, maxZoom: dark.maxZoom }).addTo(map)
    const SPEED = [[0.5, '#5c6b73', 'Moored / drifting'], [5, '#4fc3e8', '0.5–5 kn'], [12, '#f7d154', '5–12 kn'], [Infinity, '#ff6b4a', '> 12 kn']]
    const colorOf = sog => SPEED.find(([max]) => (sog ?? 0) <= max)[1]
    try {
      await checkService()
      const points = await items('points', `bbox=${BBOX}&datetime=${WHEN}`, n => status(`Loading positions… ${n.toLocaleString()}`))
      L.geoJSON(points, {
        pointToLayer: (f, latlng) => L.circleMarker(latlng, { radius: f.properties.sog > 0.5 ? 4 : 2.5, color: '#0b1418', weight: 0.6, fillColor: colorOf(f.properties.sog), fillOpacity: 0.9 }),
        // Identify: Leaflet's own popup, filled from the feature's properties on click
        onEachFeature: (f, layer) => layer.bindPopup(() => popupHtml('points', f.properties), { maxWidth: 340, closeButton: true })
      }).addTo(map)
      const vessels = new Set(points.features.map(f => f.properties.mmsi)).size
      caption({
        client: 'Leaflet',
        title: 'Houston Ship Channel, 10 minutes of AIS',
        sub: `${points.features.length.toLocaleString()} positions from ${vessels.toLocaleString()} vessels (15:00–15:10 UTC, July 4 2024), filtered with datetime= on the server.`,
        legend: SPEED.map(([, color, label]) => [color, label]),
        hint: 'Click a position for the vessel\u2019s attributes.'
      })
      setTimeout(done, 2500) // basemap tiles
    } catch (err) { fail(err) }
  </script>
</body>
</html>
