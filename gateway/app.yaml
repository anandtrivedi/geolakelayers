command: ["node", "server.js"]

env:
  - name: DATABRICKS_SERVER_HOSTNAME
    value: "your-workspace.cloud.databricks.com"
  - name: DATABRICKS_HTTP_PATH
    value: "/sql/1.0/warehouses/abcdef0123456789"
  - name: CATALOGS
    value: "main"
  # Portal / Experience Builder origins allowed to call the gateway from the browser
  - name: ALLOWED_ORIGINS
    value: "https://portal.example.com,https://localhost:3001,http://localhost:5199"
  - name: RATE_LIMIT_MAX
    value: "2000"
  - name: LOG_LEVEL
    value: "info"
