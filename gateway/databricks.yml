# LakeGate: Databricks geospatial gateway for ArcGIS (Experience Builder "Databricks Data" widget) and OGC API – Features clients.
#
# One gateway per Unity Catalog metastore (a Databricks sign-in is per workspace). Workspaces that share a metastore
# see the same Unity Catalog catalogs, so one gateway can serve all of them.
#
# Deploy:  databricks bundle deploy -t <target>  &&  databricks bundle run gateway -t <target>
# New workspace: copy a target, set its host, warehouse_id and allowed_origins.

bundle:
  name: lakegate

variables:
  app_name:
    description: Name of the Databricks App
    default: lakegate
  warehouse_id:
    description: SQL warehouse the gateway queries (serverless recommended)
  allowed_origins:
    description: Comma-separated browser origins allowed to call the gateway (Portal / Experience Builder URLs). "-" = none
    default: "-"
  allowed_warehouses:
    description: Extra comma-separated warehouse ids app authors and OGC services may pick (the bound warehouse is always allowed). Lakehouse//RT warehouses are recognized by type. "-" = none
    default: "-"
  catalogs:
    description: Optional cap on the catalogs the widget may list. "-" = no cap (authors choose any catalog the user can see)
    default: "-"
  directory:
    description: Other LakeGate gateways shown in the console and offered in the widget, "name=url;name=url". "-" = none
    default: "-"
  editing:
    description: Master switch for editing ("true" / "false"). Off by default; apps also have to turn it on.
    default: "false"
  exclude_catalogs:
    description: Catalogs never listed
    default: system,samples,hive_metastore,__databricks_internal
  layer_overrides_table:
    description: Unity Catalog table (catalog.schema.table) holding authors' geometry/id overrides for tables that aren't detected automatically. "-" = overrides off
    default: "-"
  ogc_services_table:
    description: Unity Catalog table (catalog.schema.table) holding the OGC API services defined in the console. "-" = OGC API off
    default: "-"
  widget_source:
    description: Where ArcGIS admins get the Experience Builder widget (shown in the console). "-" = don't show a link
    default: https://github.com/anandtrivedi/lakegate/tree/main/widget/databricks-data

resources:
  apps:
    gateway:
      name: ${var.app_name}
      description: LakeGate - Databricks geospatial gateway for ArcGIS and OGC (Unity Catalog tables as FeatureServer layers and OGC API - Features)
      source_code_path: .
      # Queries run as the signed-in user, so Unity Catalog decides what each person sees
      user_api_scopes:
        - sql
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
      config:
        # Node caps its heap near 1.5 GB by default; big line layers (long tracks) need more headroom
        command: ["node", "--max-old-space-size=3072", "server.js"]
        env:
          - name: DATABRICKS_WAREHOUSE_ID
            value_from: sql-warehouse
          - name: ALLOWED_ORIGINS
            value: ${var.allowed_origins}
          - name: ALLOWED_WAREHOUSES
            value: ${var.allowed_warehouses}
          - name: CATALOGS
            value: ${var.catalogs}
          - name: DIRECTORY
            value: ${var.directory}
          - name: EDITING
            value: ${var.editing}
          - name: EXCLUDE_CATALOGS
            value: ${var.exclude_catalogs}
          - name: LAYER_OVERRIDES_TABLE
            value: ${var.layer_overrides_table}
          - name: OGC_SERVICES_TABLE
            value: ${var.ogc_services_table}
          - name: WIDGET_SOURCE
            value: ${var.widget_source}
          - name: RATE_LIMIT_MAX
            value: "2000"
          # Smaller pages draw sooner; big tables only draw when zoomed in (BIG_TABLE_FEATURES)
          - name: MAX_ROWS
            value: "4000"
          - name: BIG_TABLE_FEATURES
            value: "250000"
          - name: LOG_LEVEL
            value: info
      permissions:
        - group_name: account users
          level: CAN_USE

targets:
  # your-workspace (shares its metastore with a second workspace)
  prod:
    default: true
    workspace:
      host: https://your-workspace.cloud.databricks.com
    variables:
      warehouse_id: abcdef0123456789
      # Large serverless warehouse authors may pick for heavier layers (2X-Large deliberately not allowed)
      # fff7454b: Large serverless; 0000000000000a01: Lakehouse//RT (Small), recognized by its type
      allowed_warehouses: abcdef1234567890,0000000000000a01
      editing: "true"
      ogc_services_table: main.lakegate.ogc_services
      layer_overrides_table: main.lakegate.layer_overrides
      directory: prod=https://lakegate-1234567890123456.aws.databricksapps.com;gov=https://lakegate-6543210987654321.aws-gov.databricksapps.us
      allowed_origins: https://portal.example.com,https://localhost:3001,http://localhost:5199

  # gov (GovCloud, separate metastore): second workspace for multi-workspace testing
  gov:
    workspace:
      host: https://your-gov-workspace.cloud.databricks.us
    variables:
      warehouse_id: fedcba9876543210
      directory: prod=https://lakegate-1234567890123456.aws.databricksapps.com;gov=https://lakegate-6543210987654321.aws-gov.databricksapps.us
      allowed_origins: https://portal.example.com,https://localhost:3001,http://localhost:5199
