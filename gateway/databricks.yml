# GeoLakeLayers: Databricks geospatial gateway for ArcGIS (Experience Builder "Databricks Data" widget) and OGC API – Features clients.
#
# One gateway per Unity Catalog metastore (a Databricks sign-in is per workspace). Workspaces that share a metastore
# see the same Unity Catalog catalogs, so one gateway can serve all of them.
#
# Deploy:  databricks bundle deploy -t <target>  &&  databricks bundle run gateway -t <target>
# Targets: copy targets.example.yml to targets.local.yml and set host, warehouse_id and allowed_origins.

bundle:
  name: geolakelayers

# Deployment targets live in targets.local.yml (gitignored); start from targets.example.yml
include:
  - targets*.local.yml

variables:
  app_name:
    description: Name of the Databricks App
    default: geolakelayers
  compute_size:
    description: App compute, MEDIUM (2 vCPU, 6 GB) or LARGE (4 vCPU, 12 GB, twice the DBUs). LARGE helps with long line layers at full detail
    default: MEDIUM
  node_heap_mb:
    description: Node heap limit in MB; leave about half the app's memory for buffers (3072 on MEDIUM, 8192 on LARGE)
    default: "3072"
  warehouse_id:
    description: SQL warehouse the gateway queries (serverless recommended)
  allowed_origins:
    description: Comma-separated browser origins allowed to call the gateway (Portal / Experience Builder URLs). "-" = none
    default: "-"
  allowed_warehouses:
    description: Extra comma-separated warehouse ids app authors and OGC services may pick (the bound warehouse is always allowed). Lakehouse//RT warehouses are recognized by type. "-" = none
    default: "-"
  catalogs:
    description: Optional cap on the catalogs the widget may list. "-" = no cap (authors choose any catalog the user can see)
    default: "-"
  directory:
    description: Other GeoLakeLayers gateways shown in the console and offered in the widget, "name=url;name=url". "-" = none
    default: "-"
  editing:
    description: Master switch for editing ("true" / "false"). Off by default; apps also have to turn it on.
    default: "false"
  exclude_catalogs:
    description: Catalogs never listed
    default: system,samples,hive_metastore,__databricks_internal
  layer_overrides_table:
    description: Unity Catalog table (catalog.schema.table) holding authors' geometry/id overrides for tables that aren't detected automatically. "-" = overrides off
    default: "-"
  open_tables:
    description: Tables (catalog.schema.table, comma-separated) read as the app's service principal, so anyone who can sign in to the gateway sees them whatever their own grants. Grant the service principal SELECT on each. Edits still run as the editor. "-" = none (every read runs as the signed-in user)
    default: "-"
  ogc_services_table:
    description: Unity Catalog table (catalog.schema.table) holding the OGC API services defined in the console. "-" = OGC API off
    default: "-"
  widget_source:
    description: Where ArcGIS admins get the Experience Builder widget (shown in the console). "-" = don't show a link
    default: https://github.com/anandtrivedi/geolakelayers/tree/main/widget/databricks-data
  cdf_source:
    description: Where ArcGIS admins get the Databricks Custom Data Feed provider, for layers in Map Viewer and ArcGIS Pro (shown in the console). "-" = don't mention it
    default: https://github.com/anandtrivedi/esri-customdatafeed

resources:
  apps:
    gateway:
      name: ${var.app_name}
      description: GeoLakeLayers - Databricks geospatial gateway for ArcGIS and OGC (Unity Catalog tables as FeatureServer layers and OGC API - Features)
      source_code_path: .
      compute_size: ${var.compute_size}
      # Queries run as the signed-in user, so Unity Catalog decides what each person sees
      user_api_scopes:
        - sql
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
      config:
        # Node caps its heap near 1.5 GB by default; node_heap_mb raises it to fit the compute size
        command: ["node", "--max-old-space-size=${var.node_heap_mb}", "server.js"]
        env:
          - name: DATABRICKS_WAREHOUSE_ID
            value_from: sql-warehouse
          - name: ALLOWED_ORIGINS
            value: ${var.allowed_origins}
          - name: ALLOWED_WAREHOUSES
            value: ${var.allowed_warehouses}
          - name: CATALOGS
            value: ${var.catalogs}
          - name: DIRECTORY
            value: ${var.directory}
          - name: EDITING
            value: ${var.editing}
          - name: EXCLUDE_CATALOGS
            value: ${var.exclude_catalogs}
          - name: LAYER_OVERRIDES_TABLE
            value: ${var.layer_overrides_table}
          - name: OPEN_TABLES
            value: ${var.open_tables}
          - name: OGC_SERVICES_TABLE
            value: ${var.ogc_services_table}
          - name: WIDGET_SOURCE
            value: ${var.widget_source}
          - name: CDF_SOURCE
            value: ${var.cdf_source}
          - name: RATE_LIMIT_MAX
            value: "2000"
          # Smaller pages draw sooner; big tables only draw when zoomed in (BIG_TABLE_FEATURES)
          - name: MAX_ROWS
            value: "4000"
          - name: BIG_TABLE_FEATURES
            value: "250000"
          - name: LOG_LEVEL
            value: info
      permissions:
        - group_name: account users
          level: CAN_USE

