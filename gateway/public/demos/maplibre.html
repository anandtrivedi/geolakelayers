<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MapLibre GL · GeoLakeLayers live demo</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="vendor/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>
  <div id="caption"></div>
  <div id="status">Loading…</div>
  <script type="module">
    // AIS H3 r7 hexes off the U.S. Northeast, extruded by ping count, with the day's tracks underneath
    // MapLibre 6 ships as an ES module; its worker (vendor/maplibre-gl-worker.mjs) loads from beside it
    import * as maplibregl from './vendor/maplibre-gl.mjs'
    import { checkService, items, caption, status, done, fail, nav, popupHtml, RAMP, breaks, splitJumps, maplibreDarkStyle, firstLabelLayer } from './common.js'
    nav()
    const BBOX = '-76.5,38,-69,42'
    const map = new maplibregl.Map({
      container: 'map',
      style: maplibreDarkStyle(),
      center: [-72.9, 40.2], zoom: 7.1, pitch: 60, bearing: -24, attributionControl: { compact: true }
    })
    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'bottom-right')
    map.on('load', async () => {
      try {
        await checkService()
        const [hexes, tracks] = await Promise.all([
          items('hex_r7', `bbox=${BBOX}`, n => status(`Loading hexes… ${n.toLocaleString()}`)),
          items('tracks', `bbox=${BBOX}`)
        ])
        // Moored ships ping all day, so harbors dwarf the lanes: color and height both follow log(pings)
        const cuts = breaks(hexes.features.map(f => f.properties.ping_count))
        const ln = ['ln', ['+', 1, ['get', 'ping_count']]]
        const color = ['interpolate', ['linear'], ln, ...cuts.flatMap((c, i) => [Math.log(1 + c), RAMP[i]]), Math.log(1 + cuts[3] * 4), RAMP[4]]
        // data under the basemap's place names (the open basemap has them; the Esri raster doesn't)
        const below = firstLabelLayer(map)
        map.addSource('tracks', { type: 'geojson', data: splitJumps(tracks) })
        map.addLayer({ id: 'tracks', type: 'line', source: 'tracks', paint: { 'line-color': '#4fc3e8', 'line-width': 0.7, 'line-opacity': 0.45 } }, below)
        map.addSource('hexes', { type: 'geojson', data: hexes })
        map.addLayer({
          id: 'hexes', type: 'fill-extrusion', source: 'hexes',
          paint: { 'fill-extrusion-color': color, 'fill-extrusion-height': ['*', ln, 1600], 'fill-extrusion-opacity': 0.9 }
        }, below)
        // Identify: a hex where there is one, else the track under the pointer
        const LAYERS = ['hexes', 'tracks'], COLLECTION = { hexes: 'hex_r7', tracks: 'tracks' }
        let popup
        map.on('click', e => {
          const f = map.queryRenderedFeatures(e.point, { layers: LAYERS })[0]
          if (popup) popup.remove()
          if (!f) return
          popup = new maplibregl.Popup({ maxWidth: '340px' }).setLngLat(e.lngLat).setHTML(popupHtml(COLLECTION[f.layer.id], f.properties)).addTo(map)
        })
        map.on('mousemove', e => { map.getCanvas().style.cursor = map.queryRenderedFeatures(e.point, { layers: LAYERS }).length ? 'pointer' : '' })
        caption({
          client: 'MapLibre GL',
          title: 'AIS traffic off the U.S. Northeast, July 4 2024',
          sub: `${hexes.features.length.toLocaleString()} H3 r7 hexes extruded by AIS pings, over ${tracks.features.length.toLocaleString()} vessel tracks. Drag with the right mouse button to tilt and turn.`,
          legend: [[RAMP[0], `${cuts[0]} pings`], [RAMP[2], `${cuts[2]}`], [RAMP[3], `${cuts[3]}`], [RAMP[4], `${cuts[3] * 4}+`]],
          hint: 'Click a hex or a track for its attributes.'
        })
        map.once('idle', done)
      } catch (err) { fail(err) }
    })
  </script>
</body>
</html>
